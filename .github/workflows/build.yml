name: Build Wii U plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build with Wii U toolchain
        run: |
          docker build -t nusbg-builder .
          docker run --rm -v "$PWD:/project" nusbg-builder make

      - name: Upload WPS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: NUSspliBackgroundDownloadManager
          path: NUSspliBackgroundDownloadManager.wps
